openapi: 3.0.3
info:
  title: API de Departamentos y Asignaciones de Empleados
  version: 3.0.0
  description: Contrato para CRUD de departamentos con baja logica y relacion historica con empleados.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/departamentos:
    get:
      summary: Listar departamentos
      operationId: listarDepartamentos
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtro de estado; por defecto ACTIVO.
          schema:
            type: string
            enum: [ACTIVO, INACTIVO, TODOS]
            default: ACTIVO
      responses:
        '200':
          description: Lista de departamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartamentoResumenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Crear departamento
      operationId: crearDepartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoCreateRequest'
      responses:
        '201':
          description: Departamento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartamentoDetalleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/departamentos/{departamentoId}:
    parameters:
      - name: departamentoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      summary: Obtener detalle de departamento
      operationId: obtenerDepartamento
      responses:
        '200':
          description: Departamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartamentoDetalleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar departamento
      operationId: actualizarDepartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoUpdateRequest'
      responses:
        '200':
          description: Departamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartamentoDetalleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Inactivar departamento (baja logica)
      operationId: inactivarDepartamento
      responses:
        '204':
          description: Departamento inactivado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/departamentos/{departamentoId}/empleados:
    parameters:
      - name: departamentoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      summary: Listar empleados activos de un departamento
      operationId: listarEmpleadosPorDepartamento
      responses:
        '200':
          description: Empleados actualmente asignados al departamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmpleadoDepartamentoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/empleados/{clave}/departamento:
    parameters:
      - name: clave
        in: path
        required: true
        schema:
          type: string
          pattern: '^EMP-[0-9]+$'

    put:
      summary: Asignar o reasignar empleado a departamento
      operationId: asignarDepartamentoAEmpleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoDepartamentoAssignRequest'
      responses:
        '200':
          description: Asignacion aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoDepartamentoActualResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Remover asignacion activa de empleado
      operationId: removerDepartamentoDeEmpleado
      responses:
        '204':
          description: Empleado desvinculado de su departamento activo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    DepartamentoCreateRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 255
          nullable: true

    DepartamentoUpdateRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 255
          nullable: true

    DepartamentoResumenResponse:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean

    DepartamentoDetalleResponse:
      type: object
      required: [id, nombre, activo, totalEmpleadosActivos]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
        totalEmpleadosActivos:
          type: integer
          minimum: 0

    EmpleadoDepartamentoAssignRequest:
      type: object
      required: [departamentoId]
      properties:
        departamentoId:
          type: integer
          format: int64
          minimum: 1

    EmpleadoDepartamentoActualResponse:
      type: object
      required: [empleadoClave, departamentoId, departamentoNombre, fechaInicio]
      properties:
        empleadoClave:
          type: string
          pattern: '^EMP-[0-9]+$'
        departamentoId:
          type: integer
          format: int64
          minimum: 1
        departamentoNombre:
          type: string
        fechaInicio:
          type: string
          format: date-time

    EmpleadoDepartamentoResponse:
      type: object
      required: [empleadoClave, nombre, fechaInicio]
      properties:
        empleadoClave:
          type: string
          pattern: '^EMP-[0-9]+$'
        nombre:
          type: string
          maxLength: 100
        fechaInicio:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Credenciales invalidas o sesion no valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflicto de negocio o integridad
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
