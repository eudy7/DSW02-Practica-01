name: Cypress Login E2E

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  cypress-login:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost/auth/config >/dev/null; then
              echo "Application is up"
              exit 0
            fi
            echo "Waiting for application... ($i/60)"
            sleep 5
          done
          echo "Application did not start in time"
          docker compose ps
          exit 1

      - name: Run Cypress login test
        working-directory: frontend
        run: npx --yes cypress@15.14.1 run --spec cypress/e2e/login.cy.ts --config baseUrl=http://localhost

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
